  <a (click)="scrollTo('hero')"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'home'">
    Inicio
  </a>
  <a (click)="scrollTo('about')"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'about'">
    Sobre mí
  </a>
  <a (click)="scrollTo('projects')"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'projects'">
    Proyectos
  </a>
  <a (click)="scrollTo('skills')"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'skills'">
    Skills

  <a (click)="scrollTo('cv')"

<!-- Mobile menu button -->
<button (click)="toggleMobileMenu()"
        class="md:hidden p-2 rounded-lg text-gray-600 hover:text-primary hover:bg-primary/5 transition-colors"
        aria-label="Menú de navegación">
  @if (!mobileOpen()) {
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  } @else {
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  }
</button>

@if (mobileOpen()) {
  <div class="fixed inset-0 top-16 z-40 md:hidden">
    <div class="absolute inset-0 bg-black/20" (click)="toggleMobileMenu()"></div>
    <nav class="relative glass p-6 flex flex-col gap-2">
      <a (click)="scrollTo('hero'); toggleMobileMenu()"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        Inicio
      </a>
      <a (click)="scrollTo('about'); toggleMobileMenu()"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        Sobre mí
      </a>
      <a (click)="scrollTo('projects'); toggleMobileMenu()"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        Proyectos
      </a>
      <a (click)="scrollTo('skills'); toggleMobileMenu()"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        Skills
      </a>
      <a (click)="scrollTo('cv'); toggleMobileMenu()"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        CV
      </a>
    </nav>
  </div>
}
