<nav class="hidden md:flex gap-1">
  <a (click)="scrollTo('hero')" (keydown.enter)="scrollTo('hero')" tabindex="0"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'home'">
    {{ t('nav.home') }}
  </a>
  <a (click)="scrollTo('about')" (keydown.enter)="scrollTo('about')" tabindex="0"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'about'">
    {{ t('nav.about') }}
  </a>
  <a (click)="scrollTo('projects')" (keydown.enter)="scrollTo('projects')" tabindex="0"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'projects'">
    {{ t('nav.projects') }}
  </a>
  <a (click)="scrollTo('skills')" (keydown.enter)="scrollTo('skills')" tabindex="0"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'skills'">
    {{ t('nav.skills') }}
  </a>
  <a (click)="scrollTo('cv')" (keydown.enter)="scrollTo('cv')" tabindex="0"
     class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-gray-600 transition-all duration-200 hover:text-primary hover:bg-primary/5 cursor-pointer"
     [class.active-nav]="activeSection() === 'cv'">
    {{ t('nav.cv') }}
  </a>
</nav>

<!-- Mobile menu button -->
<button (click)="toggleMobileMenu()"
        class="md:hidden p-2 rounded-lg text-gray-600 hover:text-primary hover:bg-primary/5 transition-colors"
        [attr.aria-label]="t('nav.menu_label')">
  @if (!mobileOpen()) {
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  } @else {
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  }
</button>

@if (mobileOpen()) {
  <div class="fixed inset-0 top-16 z-40 md:hidden">
    <div class="absolute inset-0 bg-black/20" (click)="toggleMobileMenu()" (keydown.enter)="toggleMobileMenu()" tabindex="0" role="button" aria-label="Cerrar menú"></div>
    <nav class="relative glass p-6 flex flex-col gap-2">
      <a (click)="scrollTo('hero'); toggleMobileMenu()" (keydown.enter)="scrollTo('hero'); toggleMobileMenu()" tabindex="0"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        {{ t('nav.home') }}
      </a>
      <a (click)="scrollTo('about'); toggleMobileMenu()" (keydown.enter)="scrollTo('about'); toggleMobileMenu()" tabindex="0"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        {{ t('nav.about') }}
      </a>
      <a (click)="scrollTo('projects'); toggleMobileMenu()" (keydown.enter)="scrollTo('projects'); toggleMobileMenu()" tabindex="0"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        {{ t('nav.projects') }}
      </a>
      <a (click)="scrollTo('skills'); toggleMobileMenu()" (keydown.enter)="scrollTo('skills'); toggleMobileMenu()" tabindex="0"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        {{ t('nav.skills') }}
      </a>
      <a (click)="scrollTo('cv'); toggleMobileMenu()" (keydown.enter)="scrollTo('cv'); toggleMobileMenu()" tabindex="0"
         class="px-4 py-2.5 rounded-lg text-base font-medium text-gray-700 hover:text-primary hover:bg-primary/5 transition-colors cursor-pointer">
        {{ t('nav.cv') }}
      </a>
    </nav>
  </div>
}
