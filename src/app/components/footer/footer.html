<footer class="relative bg-gray-900 text-gray-400 px-4 py-8">
  <div class="max-w-5xl mx-auto">
    <div class="flex flex-col md:flex-row items-center justify-between gap-8">
      <!-- Brand -->
      <div class="text-center md:text-left">
        <p class="text-lg font-bold text-white">{{ profile().name }}</p>
        <p class="text-sm mt-1">{{ profile().title }}</p>
      </div>

      <!-- Nav links -->
      <nav class="flex flex-wrap justify-center gap-x-6 gap-y-2 text-sm">
        <a (click)="scrollToTop()" class="hover:text-white transition-colors cursor-pointer">Inicio</a>
        <a (click)="scrollToTop()" href="#about" class="hover:text-white transition-colors">Sobre mí</a>
        <a (click)="scrollToTop()" href="#projects" class="hover:text-white transition-colors">Proyectos</a>
        <a (click)="scrollToTop()" href="#skills" class="hover:text-white transition-colors">Skills</a>
        <a (click)="scrollToTop()" href="#cv" class="hover:text-white transition-colors">CV</a>
      </nav>

      <!-- Social -->
      <div class="flex gap-3">
        @for (link of profile().socialLinks; track link.platform) {
          <a [href]="link.url" target="_blank" rel="noopener noreferrer"
             class="w-9 h-9 rounded-lg bg-gray-800 flex items-center justify-center hover:bg-primary transition-colors duration-200 group"
             [title]="link.platform">
            @if (link.icon === 'github') {
              <svg class="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
              </svg>
            } @else if (link.icon === 'linkedin') {
              <svg class="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zM1.782 20.452h3.564V9H1.782v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            } @else if (link.icon === 'email') {
              <svg class="w-4 h-4 text-gray-400 group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            }
          </a>
        }
      </div>
    </div>

    <!-- Bottom -->
    <div class="mt-6 pt-4 border-t border-gray-800 flex flex-col sm:flex-row items-center justify-center gap-2 text-xs">
      <button (click)="scrollToTop()" class="flex items-center gap-1.5 hover:text-white transition-colors">
        Volver arriba
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
        </svg>
      </button>
    </div>
  </div>
</footer>
