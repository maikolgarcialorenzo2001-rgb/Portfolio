<button (click)="switchLang()"
        class="h-12 min-w-12 px-3 rounded-xl shadow-lg border border-white/20 backdrop-blur-md flex items-center justify-center gap-1.5 font-bold text-sm tracking-wider transition-all duration-300 hover:scale-110 hover:shadow-xl cursor-pointer"
        [class.lang-es]="currentLang() === 'es'"
        [class.lang-en]="currentLang() === 'en'"
        [class.flip]="flipping()"
        [attr.aria-label]="currentLang() === 'es' ? 'Cambiar a inglés' : 'Switch to Spanish'"
        style="perspective: 800px">
  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12h20"/>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
  </svg>
  <span>{{ currentLang() === 'es' ? 'ES' : 'EN' }}</span>
</button>
