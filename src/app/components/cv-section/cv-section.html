<section id="cv" class="relative px-4 py-24 scroll-mt-16 bg-surface-alt overflow-hidden">
  <!-- Background decorative blobs + dot pattern -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden bg-dot-pattern">
    <div class="absolute -top-32 -right-32 w-80 h-80 rounded-full bg-accent/5 blur-3xl animate-float-slow"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-primary/5 blur-3xl animate-float" style="animation-delay: 2s"></div>
    <div class="absolute top-1/3 right-1/4 w-3 h-3 rounded-full bg-primary/20 animate-pulse-soft"></div>
    <div class="absolute bottom-1/4 left-1/3 w-2 h-2 rounded-full bg-accent/20 animate-pulse-soft" style="animation-delay: 1.5s"></div>
    <div class="absolute top-2/3 left-1/5 w-1.5 h-1.5 rounded-full bg-primary/15 animate-pulse-soft" style="animation-delay: 3s"></div>
  </div>

  <div class="relative z-10 max-w-4xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-16 reveal">
      <span class="text-xs font-semibold tracking-widest uppercase text-primary">{{ t('cv.section_label') }}</span>
      <h2 class="text-3xl sm:text-4xl font-bold tracking-tight mt-2 gradient-text">
        {{ t('cv.title') }}
      </h2>
      <p class="text-gray-500 mt-3 max-w-xl mx-auto">
        {{ t('cv.description') }}
      </p>
      <div class="w-16 h-1 bg-gradient-to-r from-primary to-accent rounded-full mx-auto mt-4"></div>
    </div>

    <!-- Download button -->
    <div class="flex justify-center mb-12 reveal">
      <a [href]="'assets/pdf/' + cvFile() + '.pdf'" download
         class="inline-flex items-center gap-3 px-6 py-3.5 rounded-xl bg-primary text-white font-semibold shadow-lg transition-all duration-300 hover:bg-primary-dark hover:shadow-xl hover:-translate-y-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        {{ t('cv.download') }}
      </a>
    </div>

    <!-- CV Preview Image -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden reveal max-w-lg mx-auto">
      <picture>
        <source [srcset]="'assets/img/cv/' + cvFile() + '.png'" type="image/webp">
        <img [src]="'assets/img/cv/' + cvFile() + '.png'" alt="Curriculum Vitae - Maikol Garcia Lorenzo"
             class="w-full max-w-xl mx-auto h-auto" />
      </picture>
    </div>
  </div>
</section>
